name: CI

on:
  push:
    branches-ignore:
      - prod
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parts-log-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: parts-log-service/package-lock.json
      - run: npm ci
      - run: npm run verify
